<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />

    <!--
      Pre-hydration title only. Everything route-specific — description,
      canonical, Open Graph, Twitter — is rendered by <Seo> and hoisted by
      React 19. Declaring those here as well produced two canonical links per
      page, which is worse than having none.
    -->
    <title>Nocta — AI travel planning that reads like a local wrote it</title>

    <!--
      Theme, applied before first paint.

      This script is intentionally blocking and intentionally inline. Any other
      arrangement — a module, a deferred script, a React effect — paints the
      default theme first and then corrects it, which is the white flash every
      dark-mode site has and nobody wants. It must stay small enough that
      blocking on it is free.
    -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('nocta.theme');
          var pref =
            stored === 'light' || stored === 'dark' || stored === 'system' ? stored : 'system';
          var resolved =
            pref === 'system'
              ? window.matchMedia('(prefers-color-scheme: light)').matches
                ? 'light'
                : 'dark'
              : pref;
          var root = document.documentElement;
          root.dataset.theme = resolved;
          root.style.colorScheme = resolved;
          document
            .querySelector('meta[name="theme-color"]')
            ?.setAttribute('content', resolved === 'dark' ? '#050608' : '#fbfbfc');
        } catch (error) {
          /* Storage blocked — the dark default in the markup already applies. */
        }
      })();
    </script>

    <meta name="theme-color" content="#050608" />
    <meta name="color-scheme" content="dark light" />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!--
      Photography comes from a third-party origin, so the DNS lookup, TCP
      handshake and TLS negotiation all sit in front of the first image byte.
      Doing them during head parsing takes that off the critical path.
    -->
    <link rel="preconnect" href="https://picsum.photos" crossorigin />
    <link rel="dns-prefetch" href="https://picsum.photos" />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "Nocta",
        "applicationCategory": "TravelApplication",
        "operatingSystem": "Web",
        "description": "AI travel planning with real venues, walking times and an editable itinerary.",
        "offers": { "@type": "Offer", "price": "0", "priceCurrency": "EUR" }
      }
    </script>
  </head>
  <body>
    <!--
      Every static route is prerendered, so this page is readable without
      JavaScript — the notice is a banner about what stops working, not a wall
      instead of the content. It deliberately contains no heading: the real
      page below has an <h1>, and a second one would compete with it in the
      document outline and in every screen reader's heading list.

      The stylesheet below is what makes that claim true. Framer Motion
      server-renders each element in its `initial` state — `opacity: 0` and an
      offset transform — and animates to the resting state on mount. With
      scripting off that mount never happens, so the prerendered markup is
      present in the response and invisible on screen: the worst of both. This
      forces every animated element to its resting state, which is exactly the
      composition the reduced-motion path already ships.
    -->
    <noscript>
      <style>
        #root [style*='opacity:0'] {
          opacity: 1 !important;
        }
        #root [style*='transform'] {
          transform: none !important;
        }
      </style>
      <p
        style="
          margin: 0;
          padding: 0.875rem 1.25rem;
          font:
            500 0.875rem/1.5 system-ui,
            sans-serif;
          text-align: center;
          color: #0a0b0f;
          background: #f5c451;
        "
      >
        <strong>JavaScript is off.</strong> You can read every page, but generating an itinerary,
        rearranging a day and the interactive map all need it.
      </p>
    </noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
